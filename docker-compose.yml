version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chat-postgres
    environment:
      POSTGRES_DB: adventure
      POSTGRES_USER: chat_user
      POSTGRES_PASSWORD: chat_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_user -d adventure"]
      interval: 10s
      timeout: 5s
      retries: 5

  chat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat-service
    environment:
      SERVER_PORT: "8080"
      DATABASE_DSN: "postgres://chat_user:chat_pass@postgres:5432/adventure?sslmode=disable"
      DATABASE_MAX_CONNS: "25"
      DATABASE_MIN_CONNS: "5"
      WS_PING_INTERVAL: "30s"
      WS_PONG_WAIT: "60s"
      WS_BROADCAST_BUFFER: "256"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
